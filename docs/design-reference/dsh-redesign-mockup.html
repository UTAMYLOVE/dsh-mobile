<title>DSH Mobile 新介面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Orbitron:wght@500;600;700;800&display=swap">
<style>
/* Layout: one 390×844 phone screen — floating HUD header, swipeable glass dashboard pages, floating glass toolbar. */
:root {
  --sakura: #FEDFE1;   /* background */
  --milk: #D7C4BB;     /* milk tea */
  --pink: #DC9FB4;     /* primary, glow */
  --white: #FFFFFF;
  --aqua: #A5DEE4;     /* secondary accent: fills and glow only */
  --rose: #9E7A7A;     /* rosewood */
  --ink: #5E4445;      /* main text */
  --ink-2: #7D5F60;    /* secondary text */

  --f-display: "Orbitron", "Chakra Petch", "Noto Sans TC", system-ui, sans-serif;
  --f-label: "Chakra Petch", "Noto Sans TC", system-ui, sans-serif;
  --f-zh: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;

  --r-panel: 22px;
  --r-sheet: 30px;
  --ease-out: cubic-bezier(.22,1,.36,1);
  --ease-spring: cubic-bezier(.34,1.56,.64,1);
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: #f6cdd2;
  color: var(--ink);
  font-family: var(--f-zh);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
* { box-sizing: border-box; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }

/* ---------- phone frame ---------- */
.app {
  position: relative; width: 100%; height: 100%;
  overflow: hidden; background: var(--sakura);
  isolation: isolate;
}
@media (min-width: 520px) and (min-height: 700px) {
  .app { width: 390px; height: min(844px, 100%); border-radius: 44px;
         box-shadow: 0 30px 80px rgba(94,68,69,.28), 0 0 0 10px rgba(255,255,255,.55); }
}

/* ---------- background ---------- */
.bg { position: absolute; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.blob { position: absolute; border-radius: 50%; filter: blur(46px); opacity: .75; }
.blob.b1 { width: 300px; height: 300px; background: var(--pink); top: -60px; right: -90px; animation: drift1 18s ease-in-out infinite alternate; }
.blob.b2 { width: 260px; height: 260px; background: var(--aqua); bottom: 120px; left: -110px; animation: drift2 22s ease-in-out infinite alternate; }
.blob.b3 { width: 240px; height: 240px; background: var(--milk); top: 42%; right: -70px; animation: drift3 26s ease-in-out infinite alternate; }
@keyframes drift1 { to { transform: translate(-70px, 80px) scale(1.12); } }
@keyframes drift2 { to { transform: translate(90px, -60px) scale(.9); } }
@keyframes drift3 { to { transform: translate(-80px, -40px) scale(1.15); } }
.grid { position: absolute; left: -50%; width: 200%; height: 42%; perspective: 340px; }
.grid.floor { bottom: 0; }
.grid.ceil { top: 0; transform: scaleY(-1); }
.grid i {
  position: absolute; inset: 0; transform-origin: 50% 100%; transform: rotateX(68deg);
  background-image:
    linear-gradient(rgba(255,255,255,.95) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.95) 1px, transparent 1px);
  background-size: 44px 44px;
  animation: gridflow 6s linear infinite;
  -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 85%);
          mask-image: linear-gradient(to top, #000 10%, transparent 85%);
  opacity: .55;
}
@keyframes gridflow { to { background-position: 0 44px, 0 44px; } }

/* ---------- glass ---------- */
.glass {
  position: relative;
  background: linear-gradient(140deg, rgba(255,255,255,.62), rgba(255,255,255,.16) 60%, rgba(255,255,255,.28));
  -webkit-backdrop-filter: blur(10px) saturate(170%);
          backdrop-filter: blur(10px) saturate(170%);
  box-shadow: 0 12px 30px rgba(158,122,122,.16), 0 2px 6px rgba(158,122,122,.08);
}
.glass::before { /* gradient rim */
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.2px; pointer-events: none;
  background: linear-gradient(140deg, rgba(255,255,255,.95), rgba(220,159,180,.75) 50%, rgba(165,222,228,.9));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
}
.glass::after { /* top-left sheen */
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: radial-gradient(120% 70% at 0% 0%, rgba(255,255,255,.55), transparent 45%);
}

/* ---------- header ---------- */
.top {
  position: absolute; z-index: 5; left: 0; right: 0;
  top: env(safe-area-inset-top, 0px);
  padding: 22px 22px 0;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
}
.brand { font-family: var(--f-display); font-weight: 800; letter-spacing: .26em; font-size: 18px; color: var(--ink); }
.when { margin-top: 6px; font-family: var(--f-label); font-size: 11px; letter-spacing: .12em; color: var(--ink-2); white-space: nowrap; }
.when .demo { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 99px; background: rgba(255,255,255,.6); font-size: 10px; letter-spacing: .1em; color: var(--rose); }
.topright { display: flex; align-items: center; gap: 12px; }
.pagename { text-align: right; }
.roller { height: 20px; overflow: hidden; }
.roller-track div small { font-family: var(--f-label); font-size: 10px; letter-spacing: .2em; color: var(--ink-2); }
.roller-track { transition: transform .55s var(--ease-spring); }
.roller-track div { height: 20px; line-height: 20px; font-size: 15px; color: var(--ink); white-space: nowrap; }
.roller-track b { font-family: var(--f-zh); font-weight: 500; letter-spacing: .1em; }
.dots { display: flex; justify-content: flex-end; gap: 5px; margin-top: 8px; }
.dots span { width: 8px; height: 4px; border-radius: 4px; background: rgba(158,122,122,.25); transition: width .4s var(--ease-spring), background .3s; }
.dots span.on { width: 22px; background: var(--pink); box-shadow: 0 0 8px var(--pink); }
.gear { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; }
.gear svg { width: 20px; height: 20px; stroke: var(--ink); position: relative; z-index: 1; }

/* ---------- pages ---------- */
.stage { position: absolute; inset: 0; perspective: 1100px; touch-action: pan-y; }
.page {
  position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;
  padding: calc(env(safe-area-inset-top, 0px) + 92px) 16px calc(env(safe-area-inset-bottom, 0px) + 196px);
  display: flex; flex-direction: column; gap: 14px;
  scrollbar-width: none; will-change: transform;
  visibility: hidden;
}
.page::-webkit-scrollbar { display: none; }
.page.current { visibility: visible; }
.page.anim { visibility: visible; }
.sweep {
  position: absolute; z-index: 4; top: 0; bottom: 0; width: 2px; left: -10px; pointer-events: none; opacity: 0;
  background: linear-gradient(to bottom, transparent, #fff 20%, #fff 80%, transparent);
  box-shadow: 0 0 18px 6px rgba(255,255,255,.9), 0 0 40px 12px rgba(220,159,180,.45);
}
.sweep.go { animation: sweep .62s var(--ease-out); }
@keyframes sweep { 0% { opacity: 0; transform: translateX(0) skewX(-12deg); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateX(420px) skewX(-12deg); } }

/* panel entrance */
.panel { border-radius: var(--r-panel); padding: 16px 18px 18px; }
.page.enter .panel { animation: rise .6s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 70ms + 120ms); }
@keyframes rise { from { opacity: 0; transform: translateY(26px) scale(.98); } to { opacity: 1; transform: none; } }

.ptitle { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; font-size: 13px; color: var(--ink-2); }
.ptitle .sq { width: 7px; height: 7px; border-radius: 2px; background: var(--pink); box-shadow: 0 0 6px var(--pink); flex: none; }
.ptitle .sq.aq { background: var(--aqua); box-shadow: 0 0 6px var(--aqua); }
.ptitle .zh { letter-spacing: .12em; color: var(--ink); }
.ptitle .en { font-family: var(--f-label); font-size: 11px; letter-spacing: .2em; }
.ptitle .line { flex: 1; height: 1px; background: linear-gradient(90deg, rgba(158,122,122,.45), transparent); min-width: 12px; }
.ptitle .meta { font-family: var(--f-label); font-size: 11px; letter-spacing: .14em; white-space: nowrap; }

.num { font-family: var(--f-display); font-weight: 700; color: var(--ink); letter-spacing: .02em; }
.lbl { font-size: 12px; color: var(--ink-2); letter-spacing: .08em; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding-top: 14px; border-top: 1px solid rgba(158,122,122,.18); }
.stats3 { grid-template-columns: repeat(3, 1fr); border-top: 0; padding-top: 0; }
.stat .num { font-size: 17px; margin-top: 4px; display: block; }
.stat .num.big { font-size: 26px; }
.stats3 .stat .num.big { font-size: 22px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.two .panel { padding: 14px 16px 16px; }

/* ring */
.ringwrap { position: relative; width: 230px; height: 230px; margin: 4px auto 14px; }
.ringwrap.sm { width: 150px; height: 150px; margin: 0; flex: none; }
.ringwrap svg { width: 100%; height: 100%; overflow: visible; }
.ticks { transform-origin: 100px 100px; animation: spin 60s linear infinite; }
.inner-dash { transform-origin: 100px 100px; animation: spin 36s linear infinite reverse; }
@keyframes spin { to { transform: rotate(360deg); } }
.arc { transition: stroke-dashoffset 1.2s var(--ease-out); filter: drop-shadow(0 0 6px rgba(220,159,180,.9)); }
.ringcenter { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ringcenter .lbl { letter-spacing: .3em; }
.ringcenter .num { font-size: 52px; line-height: 1.15; }
.ringwrap.sm .ringcenter .num { font-size: 30px; }
.ringwrap.sm .ringcenter .lbl { font-size: 11px; letter-spacing: .2em; }
.ringcenter .unit { font-family: var(--f-label); font-size: 12px; letter-spacing: .2em; color: var(--ink-2); }

/* bars */
.bar { height: 7px; border-radius: 99px; background: rgba(158,122,122,.14); overflow: hidden; margin-top: 12px; }
.bar i { display: block; height: 100%; width: 0; border-radius: inherit; transition: width 1.1s var(--ease-out); }
.bar i.pk { background: linear-gradient(90deg, #e8bccb, var(--pink)); box-shadow: 0 0 10px var(--pink); }
.bar i.aq { background: linear-gradient(90deg, #cdeff2, var(--aqua)); box-shadow: 0 0 10px var(--aqua); }

/* week chart */
.week { position: relative; height: 150px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; align-items: end; padding-top: 22px; }
.week .col { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
.week .col b { width: 100%; height: 0; border-radius: 10px; background: linear-gradient(to top, rgba(215,196,187,.95), rgba(215,196,187,.55)); transition: height .9s var(--ease-out); transition-delay: calc(var(--i) * 60ms + 200ms); }
.week .col.today b { background: linear-gradient(to top, var(--rose), var(--pink)); box-shadow: 0 0 16px rgba(220,159,180,.9); }
.week .col.over b { background: linear-gradient(to top, rgba(165,222,228,.95), rgba(165,222,228,.6)); }
.week .v { position: absolute; top: -20px; font-family: var(--f-label); font-size: 11px; color: var(--ink-2); }
.week .cap { position: absolute; left: 0; right: 0; border-top: 1.5px dashed rgba(158,122,122,.55); pointer-events: none; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin-top: 8px; text-align: center; font-size: 12px; color: var(--ink-2); }

/* lists */
.list { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px dashed rgba(158,122,122,.25); }
.item:last-child { border-bottom: 0; padding-bottom: 2px; }
.item .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 6px var(--pink); flex: none; }
.item .t { flex: 1; min-width: 0; }
.item .t div:first-child { font-size: 16px; color: var(--ink); }
.item .t small { font-size: 12px; color: var(--ink-2); }
.item .num { font-size: 19px; }
.item.new { animation: flash 1.6s var(--ease-out); }
@keyframes flash { 0% { background: rgba(255,255,255,.7); } 100% { background: transparent; } }
.acct .item .t div:first-child small { margin-left: 6px; }

/* macro rings */
.macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.macro { display: flex; align-items: center; gap: 8px; }
.macro svg { width: 46px; height: 46px; flex: none; transform: rotate(-90deg); }
.macro .num { font-size: 18px; display: block; }
.macro small { font-family: var(--f-label); font-size: 11px; color: var(--ink-2); letter-spacing: .1em; }

/* water cells */
.cells { display: grid; grid-template-columns: repeat(14, 1fr); gap: 5px; }
.cells i { aspect-ratio: 1 / 1.2; border-radius: 8px; background: rgba(255,255,255,.55); border: 1px solid rgba(165,222,228,.6); transition: background .3s, box-shadow .3s; transition-delay: calc(var(--i) * 45ms + 200ms); }
.cells i.on { background: linear-gradient(160deg, #c9eef2, var(--aqua)); box-shadow: 0 0 8px rgba(165,222,228,.95); }

.chip { display: inline-block; padding: 3px 12px; border-radius: 99px; border: 1px solid var(--rose); color: var(--rose); font-size: 12px; }

/* denominations */
.den { display: grid; grid-template-columns: 62px 34px 1fr 64px; align-items: center; gap: 8px; padding: 7px 0; }
.den .num { font-size: 16px; }
.den .x { font-family: var(--f-label); font-size: 13px; color: var(--ink-2); }
.den .bar { margin: 0; }
.den .num:last-child { text-align: right; }
.hint { font-size: 13px; color: var(--ink-2); margin-top: 8px; }
.hint code { font-family: var(--f-label); color: var(--ink); }
.diff { color: var(--rose); }

.cta { display: flex; align-items: center; gap: 14px; }
.cta p { flex: 1; margin: 0; font-size: 14px; line-height: 1.6; color: var(--ink-2); }
.btn { padding: 12px 22px; border-radius: 99px; font-size: 15px; letter-spacing: .2em; white-space: nowrap; }
.btn.aq { background: rgba(165,222,228,.35); border: 1px solid rgba(165,222,228,.9); color: var(--ink); box-shadow: 0 0 12px rgba(165,222,228,.6); }
.btn.pk { background: linear-gradient(135deg, #e9b9c9, var(--pink)); color: #fff; box-shadow: 0 6px 18px rgba(220,159,180,.7); }
.btn.ghost { background: rgba(255,255,255,.55); color: var(--ink); }
.btn:active, .round:active, .tab:active { transform: scale(.96); }

/* ---------- toolbar ---------- */
.dock {
  position: absolute; z-index: 6; left: 12px; right: 12px;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  border-radius: var(--r-sheet); padding: 12px 12px 8px;
}
.compose { display: flex; gap: 10px; align-items: center; position: relative; z-index: 1; }
.compose input {
  flex: 1; min-width: 0; height: 48px; border-radius: 99px; padding: 0 18px;
  border: 1px solid rgba(255,255,255,.9); background: rgba(255,255,255,.5);
  font: 15px var(--f-zh); color: var(--ink);
}
.compose input::placeholder { color: var(--ink-2); opacity: .9; }
.round { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; flex: none; transition: transform .15s; }
.round svg { width: 22px; height: 22px; }
.round.cam { background: rgba(165,222,228,.4); border: 1px solid rgba(165,222,228,.95); box-shadow: 0 0 14px rgba(165,222,228,.7); }
.round.cam svg { stroke: var(--ink); }
.round.send { background: radial-gradient(circle at 35% 30%, #f6d3df, var(--pink)); box-shadow: 0 6px 18px rgba(220,159,180,.85); }
.round.send svg { stroke: var(--ink); }
.tabs { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 8px; }
.pill {
  position: absolute; top: 0; bottom: 0; left: 0; width: 25%; border-radius: 99px;
  background: linear-gradient(140deg, rgba(255,255,255,.85), rgba(255,255,255,.45));
  box-shadow: 0 4px 14px rgba(158,122,122,.18), inset 0 0 0 1px rgba(255,255,255,.9);
  transition: transform .55s var(--ease-spring);
}
.tab { position: relative; padding: 8px 0 7px; text-align: center; border-radius: 99px; transition: transform .15s; }
.tab b { display: block; font-size: 16px; font-weight: 500; letter-spacing: .12em; color: var(--ink-2); transition: color .3s; }
.tab small { display: block; font-family: var(--f-label); font-size: 10px; letter-spacing: .24em; color: var(--ink-2); margin-top: 1px; }
.tab.on b { color: var(--ink); }

/* ---------- sheet & toast ---------- */
.scrim { position: absolute; inset: 0; z-index: 8; background: rgba(94,68,69,.28); opacity: 0; pointer-events: none; transition: opacity .35s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet {
  position: absolute; z-index: 9; left: 12px; right: 12px;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  border-radius: var(--r-sheet); padding: 20px 20px 18px;
  background: linear-gradient(140deg, rgba(255,255,255,.88), rgba(255,240,244,.7));
  transform: translateY(115%); transition: transform .55s var(--ease-spring);
}
.sheet.on { transform: none; }
.sheet h3 { margin: 0 0 4px; font-size: 18px; font-weight: 500; letter-spacing: .1em; position: relative; z-index: 1; }
.sheet .sub { font-family: var(--f-label); font-size: 11px; letter-spacing: .24em; color: var(--ink-2); position: relative; z-index: 1; }
.sheet .rows { margin: 14px 0 16px; position: relative; z-index: 1; }
.sheet .r { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px dashed rgba(158,122,122,.25); opacity: 0; transform: translateX(28px); }
.sheet.on .r { animation: slidein .45s var(--ease-out) forwards; animation-delay: calc(var(--i) * 80ms + 180ms); }
@keyframes slidein { to { opacity: 1; transform: none; } }
.sheet .r .tag { font-size: 11px; padding: 2px 9px; border-radius: 99px; background: rgba(220,159,180,.22); color: var(--ink); letter-spacing: .1em; flex: none; }
.sheet .r .tag.aq { background: rgba(165,222,228,.4); }
.sheet .r .tag.mt { background: rgba(215,196,187,.5); }
.sheet .r .n { flex: 1; min-width: 0; font-size: 15px; }
.sheet .r .n small { color: var(--ink-2); font-size: 12px; margin-left: 4px; }
.sheet .r .num { font-size: 16px; }
.sheet .acts { display: flex; gap: 10px; justify-content: flex-end; position: relative; z-index: 1; }
.step { display: flex; align-items: center; gap: 10px; }
.step button { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.7); font-size: 18px; }
.toast {
  position: absolute; z-index: 10; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 86px);
  transform: translate(-50%, -20px); opacity: 0; transition: opacity .3s, transform .4s var(--ease-spring);
  padding: 10px 18px; border-radius: 99px; background: rgba(255,255,255,.9); color: var(--ink);
  font-size: 14px; box-shadow: 0 8px 24px rgba(158,122,122,.25); white-space: nowrap; pointer-events: none;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .sheet .r { opacity: 1; transform: none; }
}
</style>

  // ---------- render ----------
  const fmt = (v, d) => d ? v.toFixed(d) : Math.round(v).toLocaleString('en-US');

      el.querySelectorAll('.arc').forEach(a => a.style.strokeDashoffset = a.dataset.target);

    const pr = prog[id] || { k: SCRIPT[id].length - 1 };
    $('#alog').innerHTML = SCRIPT[id].slice(0, pr.k + 1).map(st => ['✍️', '✅', '❓', '⚠️'].includes(st[0])
      ? `<div class="step"><b>${st[0]} ${st[1]}</b><br>${esc(st[2])}</div>` : `<div class="step act">${st[0]} ${st[1]}：${esc(st[2])}</div>`).join('');
    $('#astop').hidden = a.st !== 'run' && a.st !== 'wait';
    aview.classList.add('on');
  }
  $('#aclose').onclick = () => aview.classList.remove('on');
  $('#astop').onclick = () => { if (viewing) { viewing.st = 'done'; toast(`已叫 ${viewing.name} 停下來（樣品）`); aview.classList.remove('on'); render(2, false); } };
  $('#afoot').addEventListener('submit', e => { e.preventDefault(); const v = $('#asay').value.trim(); if (!v) return; $('#asay').value = '';
    $('#alog').insertAdjacentHTML('beforeend', `<div class="step" style="align-self:flex-end;background:linear-gradient(135deg,#f1c3d2,#DC9FB4)">${esc(v)}</div>`); toast('已傳給代理人（樣品）'); });

  // ---------- navigation ----------
  let cur = 0, busy = false;
  const stage = $('#stage'), N = 5;
  function chrome(i) {
    $('#roller').style.transform = `translateY(${-20 * i}px)`;
    [...$('#dots').children].forEach((d, k) => d.classList.toggle('on', k === i));
    document.querySelectorAll('.tab').forEach((t, k) => { t.classList.toggle('on', k === i); t.setAttribute('aria-selected', k === i); });
    $('#pill').style.transform = `translateX(${i * 100}%)`;
  }
  function sweep() { if (reduce) return; const s = $('#sweep'); s.classList.remove('go'); void s.offsetWidth; s.classList.add('go'); }
  function goTo(next, fromDrag = 0) {
    if (next === cur || next < 0 || next >= N || busy) { if (fromDrag) settleBack(); return; }
    busy = true;
    const dir = next > cur ? 1 : -1, out = $('#p' + cur), inn = $('#p' + next);
    if (cur === 2) stopFeed();
    render(next, true); chrome(next);
    if (reduce) { out.classList.remove('current'); inn.classList.add('current'); out.style.transform = inn.style.transform = ''; cur = next; busy = false; return; }
    sweep();
    out.classList.add('anim'); inn.classList.add('anim');
    const W = stage.clientWidth;
    const startIn = fromDrag ? `translateX(${dir * W + fromDrag}px)` : `translateX(${dir * 72}%) rotateY(${-dir * 24}deg) skewY(${dir * 3}deg)`;
    const opts = { duration: 560, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'forwards' };
    const a1 = out.animate([{ transform: fromDrag ? `translateX(${fromDrag}px)` : 'none', opacity: 1, filter: 'blur(0)' }, { transform: `translateX(${-dir * 18}%) translateZ(-160px) rotateY(${dir * 10}deg) scale(.9)`, opacity: 0, filter: 'blur(8px)' }], opts);
    const a2 = inn.animate([{ transform: startIn, opacity: fromDrag ? 1 : 0 }, { transform: 'none', opacity: 1 }], opts);
    inn.classList.add('current');
    a2.onfinish = () => { out.classList.remove('current', 'anim'); inn.classList.remove('anim'); a1.cancel(); a2.cancel(); out.style.transform = inn.style.transform = ''; out.scrollTop = 0; cur = next; busy = false; if (next === 1) inn.scrollTop = inn.scrollHeight; };
  }
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => goTo(+t.dataset.go)));

  let sx = 0, sy = 0, dx = 0, dragging = false, decided = false, t0 = 0, neighbor = null;
  function settleBack() {
    const cp = $('#p' + cur), nb = neighbor;
    [cp, nb].forEach(p => { if (p) p.style.transition = 'transform .45s cubic-bezier(.34,1.56,.64,1)'; });
    cp.style.transform = ''; if (nb) nb.style.transform = `translateX(${dx < 0 ? 100 : -100}%)`;
    setTimeout(() => { cp.style.transition = ''; if (nb) { nb.style.transition = ''; nb.style.transform = ''; nb.classList.remove('anim'); } }, 460);
  }
  stage.addEventListener('pointerdown', e => { if (busy || (e.pointerType === 'mouse' && e.button !== 0)) return; sx = e.clientX; sy = e.clientY; dx = 0; dragging = true; decided = false; t0 = performance.now(); neighbor = null; });
  stage.addEventListener('pointermove', e => {
    if (!dragging) return;
    const mx = e.clientX - sx, my = e.clientY - sy;
    if (!decided) { if (Math.abs(mx) < 8 && Math.abs(my) < 8) return; decided = true; if (Math.abs(my) > Math.abs(mx)) { dragging = false; return; } stage.setPointerCapture(e.pointerId); }
    const W = stage.clientWidth, cp = $('#p' + cur), target = cur - Math.sign(mx), edge = target < 0 || target >= N;
    dx = edge ? mx * 0.28 : mx; cp.style.transform = `translateX(${dx}px)`;
    if (!edge) {
      if (neighbor && neighbor !== $('#p' + target)) { neighbor.style.transform = ''; neighbor.classList.remove('anim'); delete neighbor.dataset.ready; }
      neighbor = $('#p' + target);
      if (!neighbor.dataset.ready) { render(target, false); neighbor.dataset.ready = '1'; }
      neighbor.classList.add('anim'); neighbor.style.transform = `translateX(${dx + (mx < 0 ? W : -W)}px)`;
    }
  });
  const end = () => {
    if (!dragging) return; dragging = false; if (!decided) return;
    const W = stage.clientWidth, v = Math.abs(dx) / Math.max(1, performance.now() - t0), target = cur - Math.sign(dx);
    if (neighbor) delete neighbor.dataset.ready;
    if ((Math.abs(dx) > W * 0.22 || v > 0.6) && target >= 0 && target < N) { if (neighbor) neighbor.style.transform = ''; neighbor = null; $('#p' + cur).style.transform = ''; goTo(target, dx); }
    else settleBack();
  };
  stage.addEventListener('pointerup', end); stage.addEventListener('pointercancel', end);

  // ---------- toast ----------
  let tt;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2200); }

  // ---------- reading mode ----------
  const reader = $('#reader'), rtext = $('#rtext');
  let rsize = 18, chap = 12, book = '霧城';
  function fillReader() {
    $('#rttl').textContent = `《${book}》第 ${chap} 章`;
    rtext.innerHTML = `<h1>第 ${chap} 章　末班車</h1>` + CH12.map(p => `<p>${p}</p>`).join('') + CH12.slice(0, 5).map(p => `<p>${p}</p>`).join('');
    rtext.scrollTop = 0; onScroll();
  }
  function openReader(b, c) { book = b; chap = c; fillReader(); reader.classList.add('on'); }
  function onScroll() { const max = rtext.scrollHeight - rtext.clientHeight, p = max > 0 ? rtext.scrollTop / max : 1; $('#rprog').style.width = p * 100 + '%'; $('#rpct').textContent = Math.round(p * 100) + '%'; }
  rtext.addEventListener('scroll', onScroll, { passive: true });
  $('#rclose').onclick = () => reader.classList.remove('on');
  $('#rsm').onclick = () => { rsize = Math.max(14, rsize - 1); rtext.style.setProperty('--rs', rsize + 'px'); };
  $('#rlg').onclick = () => { rsize = Math.min(26, rsize + 1); rtext.style.setProperty('--rs', rsize + 'px'); };
  $('#rnight').onclick = () => reader.classList.toggle('night');
  $('#rnext').onclick = () => { chap += 1; toast(`請 Claude 寫第 ${chap} 章…（樣品）`); fillReader(); };
  addEventListener('keydown', e => { if (e.key === 'Escape') { reader.classList.remove('on'); aview.classList.remove('on'); slist.classList.remove('on'); } });

  // ---------- send (sample) ----------
  $('#compose').addEventListener('submit', e => {
    e.preventDefault();
    const input = $('#say'), text = input.value.trim() || '繼續寫下一章';
    input.value = '';
    const show = () => {
      const chat = $('#chat'); if (!chat) return;
      const me = document.createElement('div'); me.className = 'msg me'; me.textContent = text; chat.appendChild(me);
      const ai = document.createElement('div'); ai.className = 'msg ai glass'; ai.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>'; chat.appendChild(ai);
      const p1 = $('#p1'); p1.scrollTop = p1.scrollHeight;
      setTimeout(() => { ai.innerHTML = '<div>（樣品：真的 App 會由 dsh 即時一個字一個字回覆，長文可以按「閱讀模式」。）</div>'; p1.scrollTop = p1.scrollHeight; }, reduce ? 0 : 1100);
    };
    if (cur !== 1) { goTo(1); setTimeout(show, reduce ? 0 : 650); } else show();
  });
  $('#cam').addEventListener('click', () => toast('樣品：附加檔案（照片、文字檔）'));

  // ---------- boot ----------
  chrome(0); $('#p0').classList.add('current'); render(0, true);
})();
</script>

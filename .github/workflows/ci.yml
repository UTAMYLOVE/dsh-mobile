name: CI

on:
  push:
    paths-ignore:
      - "docs/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Install SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      # Unit tests, and no analytics, crash-report or tracking library anywhere. The screen tests also save pictures of the
      # main screens (invented demo data only) so the look can be checked without a phone.
      - run: ./gradlew :core:test :app:testDebugUnitTest :app:verifyNoTelemetry --no-daemon "-Pdshm.shots=$GITHUB_WORKSPACE/shots"
      - name: Upload screen pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: shots
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            android/app/build/reports/tests
            android/app/build/test-results
            android/core/build/reports/tests
          retention-days: 7

  # 小雨娛樂 end to end on a real Android (x86_64 emulator): AgencyE2eTest on the real encrypted database and Keystore.
  # The model is an in-process fake (src/androidTest/.../FakeModel.kt) with a fake key: no real key, no cost. The APK carries no
  # rootfs and no native runtime (arch T09), so this job needs no other job and builds a plain debug APK.
  e2e:
    runs-on: ubuntu-latest
    # AgencyE2eTest gates the release; the jank gate comes back for the conversation in T21 (advisory).
    timeout-minutes: 45
    steps:
      # The emulator's userdata image needs 1.2 x disk-size free on the runner; the stock image leaves ~5 GB.
      - name: Free runner disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift \
            /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/julia* || true
          sudo docker image prune --all --force > /dev/null || true
          df -h / | tail -1
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Install SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the app and test APKs
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Run the instrumentation tests on the emulator
        # A test that hangs must end this step, not the job: the steps below then still list what ran and upload the logcat.
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disk-size: 6G
          # 3 GB guest plus a 1.5 GB Gradle heap leaves the runner room (a 4 GB guest beside a 2 GB Gradle JVM and SwANGLE is
          # the likely cause of the emulator that vanished without a word).
          ram-size: 3072M
          cores: 2
          # SwANGLE (SwiftShader Vulkan behind ANGLE) instead of the legacy GLES translator, which went silent on this runner.
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim
          disable-animations: true
          working-directory: android
          # The APKs are built already: this Gradle only installs and drives the tests, so it runs on a smaller heap.
          script: |
            adb logcat -c
            adb logcat -v threadtime > "$GITHUB_WORKSPACE/logcat.txt" 2>&1 < /dev/null &
            ./gradlew :app:connectedDebugAndroidTest --no-daemon -Dorg.gradle.jvmargs=-Xmx1536m
      # Names, times and pass/fail only (failure messages stay in the uploaded report), so a green job shows what ran.
      - name: List the instrumentation test results
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, re
          files = glob.glob('android/app/build/outputs/androidTest-results/connected/**/TEST-*.xml', recursive=True)
          print('### Instrumentation tests'); print()
          for f in files:
              for m in re.finditer(r'<testcase name="([^"]+)" classname="([^"]+)" time="([^"]+)"\s*(?:/>|>(.*?)</testcase>)', open(f).read(), re.S):
                  body = m[4] or ''
                  state = 'FAIL' if ('<failure' in body or '<error' in body) else ('SKIPPED' if '<skipped' in body else 'PASS')
                  print(f'- {state} {m[2].rsplit(".", 1)[-1]}.{m[1]} ({float(m[3]):.1f} s)')
          if not files: print('no results')
          PY
      - name: Print failures and app crashes
        if: failure() || cancelled()
        run: |
          python3 - <<'PY'
          import glob, re, html
          for f in glob.glob('android/app/build/outputs/androidTest-results/connected/**/TEST-*.xml', recursive=True):
              for m in re.finditer(r'<testcase name="([^"]+)"[^>]*>(.*?)</testcase>', open(f).read(), re.S):
                  if '<failure' in m[2] or '<error' in m[2]:
                      print(f'=== {m[1]}')
                      print('\n'.join(html.unescape(m[2]).splitlines()[:60]))
          PY
          echo "=== runner memory (an emulator that vanishes without a word is usually the host's OOM killer)"
          free -m || true
          sudo dmesg 2>/dev/null | grep -iE "killed process|out of memory|oom-kill|oom_reaper" | tail -n 20 || true
          echo "=== logcat: crashes, ANRs, low-memory kills, test runner"
          grep -E "FATAL EXCEPTION|AndroidRuntime|ANR in|lowmemorykiller|Low on memory|TestRunner|app\.dshmobile" logcat.txt | grep -vE "token=|Authorization|api[_-]?key" | tail -n 200 || true
      - name: Upload test reports and logcat
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
            logcat.txt
          retention-days: 7

name: CI

on:
  push:
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Install SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest --no-daemon

  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.10
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: plugins/pnpm-lock.yaml
      - run: pnpm -C plugins install --frozen-lockfile
      - run: pnpm -C plugins test

  rootfs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Build rootfs
        run: bash rootfs/build-rootfs.sh ${{ matrix.arch }} out/dshm-rootfs-${{ matrix.arch }}.tar.xz
      - name: Smoke test
        run: bash rootfs/smoke-test.sh out/dshm-rootfs-${{ matrix.arch }}.tar.xz
      - name: Size summary
        run: |
          f=out/dshm-rootfs-${{ matrix.arch }}.tar.xz
          echo "### rootfs ${{ matrix.arch }}: $(du -h $f | cut -f1) ($(stat -c %s $f) bytes)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dshm-rootfs-${{ matrix.arch }}
          path: |
            out/dshm-rootfs-${{ matrix.arch }}.tar.xz
            out/dshm-rootfs-${{ matrix.arch }}.package-lock.json
            out/dshm-rootfs-${{ matrix.arch }}.npm-ls.txt
          retention-days: 7

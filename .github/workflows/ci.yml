name: CI

on:
  push:
    paths-ignore:
      - "docs/**"
      - "spike/**"
      - ".github/workflows/native-spike.yml"
  pull_request:
  # A manual run can bisect a renderer crash on the emulator: the shell then draws only its plain pink ground.
  workflow_dispatch:
    inputs:
      plain_background:
        description: "e2e: plain background (no glows, no grids)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Install SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest --no-daemon

  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.10
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: plugins/pnpm-lock.yaml
      - run: pnpm -C plugins install --frozen-lockfile
      - run: pnpm -C plugins test

  rootfs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4
      # The rootfs only depends on rootfs/, plugins/ and the staging steps below (this file): unchanged, the last build is reused
      # (saves ~15 min per push). Its version marker is ROOTFS_VERSION plus a content hash of rootfs/ and plugins/ (source-hash.sh).
      - name: Restore a rootfs built from the same sources
        id: rootfs-cache
        uses: actions/cache@v4
        with:
          path: |
            out/dshm-rootfs-${{ matrix.arch }}.tar.xz
            out/dshm-rootfs-${{ matrix.arch }}.package-lock.json
            out/dshm-rootfs-${{ matrix.arch }}.npm-ls.txt
          key: rootfs-${{ matrix.arch }}-${{ hashFiles('rootfs/**', 'plugins/**', '.github/workflows/ci.yml') }}
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: pnpm/action-setup@v4
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        with:
          version: 11.28.10
      - uses: actions/setup-node@v4
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: plugins/pnpm-lock.yaml
      - name: Build plugins
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        run: |
          pnpm -C plugins install --frozen-lockfile
          pnpm -C plugins build
      - name: Stage plugins for the rootfs
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p out/staging/plugins/memory out/staging/plugins/notify out/staging/plugins/ui
          cp plugins/packages/memory/dist/index.js out/staging/plugins/memory/index.js
          cp plugins/packages/notify/dist/index.js out/staging/plugins/notify/index.js
          cp plugins/packages/ui/dist/index.js out/staging/plugins/ui/index.js
      - name: Build rootfs
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        run: bash rootfs/build-rootfs.sh ${{ matrix.arch }} out/dshm-rootfs-${{ matrix.arch }}.tar.xz out/staging
      - name: Smoke test
        run: bash rootfs/smoke-test.sh out/dshm-rootfs-${{ matrix.arch }}.tar.xz
      - name: Size summary
        run: |
          f=out/dshm-rootfs-${{ matrix.arch }}.tar.xz
          echo "### rootfs ${{ matrix.arch }}: $(du -h $f | cut -f1) ($(stat -c %s $f) bytes)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dshm-rootfs-${{ matrix.arch }}
          path: |
            out/dshm-rootfs-${{ matrix.arch }}.tar.xz
            out/dshm-rootfs-${{ matrix.arch }}.package-lock.json
            out/dshm-rootfs-${{ matrix.arch }}.npm-ls.txt
          retention-days: 7

  # Spec §9 end to end on a real Android (x86_64 emulator): proot + Debian + Node 24 + the official dsh + our plugins + the app.
  # The model is an in-process fake (src/androidTest/.../FakeModel.kt) with a fake key: no real key, no cost.
  e2e:
    needs: [rootfs]
    runs-on: ubuntu-latest
    # The stage-1 suite drives the native shell (t01-t24), which gates the release, and measures jank (PerfGateTest) on a
    # software GPU. The jank numbers are ADVISORY here (they go to the step summary and never fail the job on their threshold;
    # numbers from a real device decide that gate later); a crash or exception in PerfGateTest still fails it.
    timeout-minutes: 90
    env:
      ROOTFS_FILE: ${{ github.workspace }}/rootfs-artifact/dshm-rootfs-x86_64.tar.xz
    steps:
      # The emulator's userdata image needs 1.2 x disk-size free on the runner; the stock image leaves ~5 GB.
      - name: Free runner disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift \
            /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/julia* || true
          sudo docker image prune --all --force > /dev/null || true
          df -h / | tail -1
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Install SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: dshm-rootfs-x86_64
          path: rootfs-artifact
      - name: Build the app and test APKs (x86_64 rootfs bundled)
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon -Pdshm.rootfsAbi=x86_64 "-Pdshm.rootfsFile=$ROOTFS_FILE"
      - name: Run the instrumentation tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PLAIN_BACKGROUND: ${{ inputs.plain_background && 'true' || 'false' }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disk-size: 6G
          # 3 GB guest plus a 1.5 GB Gradle heap leaves the runner room (a 4 GB guest beside a 2 GB Gradle JVM and SwANGLE is
          # the likely cause of the emulator that vanished without a word).
          ram-size: 3072M
          cores: 2
          # SwANGLE (SwiftShader Vulkan behind ANGLE) instead of the legacy GLES translator: on swiftshader_indirect the emulator
          # went silent 0.2 s after the native shell's first frame (runs 77, 80, 84: logcat ends at the app's first RenderThread
          # buffer, then "device not found"); the WebView shell before it rendered fine there.
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim
          disable-animations: true
          working-directory: android
          # The APKs are built already: this Gradle only installs and drives the tests, so it runs on a smaller heap.
          script: |
            adb logcat -c
            adb logcat -v threadtime > "$GITHUB_WORKSPACE/logcat.txt" 2>&1 < /dev/null &
            ./gradlew :app:connectedDebugAndroidTest --no-daemon -Dorg.gradle.jvmargs=-Xmx1536m -Pdshm.rootfsAbi=x86_64 "-Pdshm.rootfsFile=$ROOTFS_FILE" "-Pandroid.testInstrumentationRunnerArguments.plainBackground=$PLAIN_BACKGROUND"
      # Names, times and pass/fail only (failure messages stay in the uploaded report), so a green job shows what ran.
      - name: List the instrumentation test results
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, re
          files = glob.glob('android/app/build/outputs/androidTest-results/connected/**/TEST-*.xml', recursive=True)
          print('### Instrumentation tests'); print()
          for f in files:
              for m in re.finditer(r'<testcase name="([^"]+)" classname="([^"]+)" time="([^"]+)"\s*(?:/>|>(.*?)</testcase>)', open(f).read(), re.S):
                  body = m[4] or ''
                  state = 'FAIL' if ('<failure' in body or '<error' in body) else ('SKIPPED' if '<skipped' in body else 'PASS')
                  print(f'- {state} {m[2].rsplit(".", 1)[-1]}.{m[1]} ({float(m[3]):.1f} s)')
          if not files: print('no results')
          PY
          # t24's screen width, then the jank fractions per scenario: ADVISORY on this emulator (never a failure by themselves).
          grep -hoE "t24: .*" logcat.txt 2>/dev/null | sed 's/^/    /' | tee -a "$GITHUB_STEP_SUMMARY" || true
          {
            echo; echo "### Jank per scenario (advisory on the CI emulator; the gate is set from device numbers)"; echo
            echo "| scenario | frames | janky | fraction | threshold | verdict |"
            echo "|---|---|---|---|---|---|"
            rows=$(grep -hoE "perf-gate [a-z]+: frames=[0-9]+ janky=[0-9]+ fraction=[0-9.]+ max=[0-9.]+ verdict=[a-z-]+" logcat.txt 2>/dev/null \
              | sed -E 's/perf-gate ([a-z]+): frames=([0-9]+) janky=([0-9]+) fraction=([0-9.]+) max=([0-9.]+) verdict=([a-z-]+)/| \1 | \2 | \3 | \4 | \5 | \6 |/' || true)
            if [ -n "$rows" ]; then echo "$rows"; else echo "| (no measurement) | | | | | |"; fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Print failures and app crashes
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, re, html
          for f in glob.glob('android/app/build/outputs/androidTest-results/connected/**/TEST-*.xml', recursive=True):
              for m in re.finditer(r'<testcase name="([^"]+)"[^>]*>(.*?)</testcase>', open(f).read(), re.S):
                  if '<failure' in m[2] or '<error' in m[2]:
                      print(f'=== {m[1]}')
                      print('\n'.join(html.unescape(m[2]).splitlines()[:60]))
          PY
          echo "=== runner memory (an emulator that vanishes without a word is usually the host's OOM killer)"
          free -m || true
          sudo dmesg 2>/dev/null | grep -iE "killed process|out of memory|oom-kill|oom_reaper" | tail -n 20 || true
          echo "=== logcat: crashes, ANRs, low-memory kills, test runner"
          grep -E "FATAL EXCEPTION|AndroidRuntime|ANR in|lowmemorykiller|Low on memory|TestRunner|app\.dshmobile" logcat.txt | grep -vE "token=|Authorization|api[_-]?key" | tail -n 200 || true
      - name: Upload test reports and logcat
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
            logcat.txt
          retention-days: 7
